[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-router"
version = "0.1.0"
description = "Transformer-based banking support intent classification with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.6",
    "transformers>=5.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4"]

[project.scripts]
support-router = "support_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
