[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraclass"
version = "0.1.0"
description = "A learning-focused PyTorch project for EuroSAT land-use classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "Pillow>=9.5",
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4"]

[project.scripts]
terraclass = "terraclass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
